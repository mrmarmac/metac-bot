name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    if: github.ref != 'refs/heads/futureeval-state'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.9"
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python runner.py --mode dry-run
      - run: uv run --no-sync python evaluation.py
